name: Offline core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Mock contracts and model snapshot checks
        run: bash scripts/test_offline.sh core
      - name: Shell syntax
        run: bash -n scripts/test_offline.sh
